name: Snowflake SQL Deploy

on:
  push:
    branches: [dev, staging, main]
    tags: ['*']
  workflow_dispatch: {}

env:
  SNOWFLAKE_AUTHENTICATOR: SNOWFLAKE_JWT

jobs:
    deploy_staging:
        name: Deploy to Staging
        runs-on: ubuntu-latest
        if: github.ref == 'refs/heads/staging'
        environment:
            name: staging

        env:
            SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
            SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
            SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
            SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
            SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
            SNOWFLAKE_AUTHENTICATOR: SNOWFLAKE_JWT

        steps:
            - uses: actions/checkout@v4

            - name: "Install Snowflake CLI"
              run: |
                 pip install snowflake-cli==3.16.0

            - name: "Setup Snowflake Auth"
              run: |
                  mkdir -p ~/.snowflake
                    echo "$SNOWFLAKE_PRIVATE_KEY" > ~/.snowflake/key.p8
                    chmod 600 ~/.snowflake/key.p8
                    echo "SNOWFLAKE_PRIVATE_KEY_PATH=$HOME/.snowflake/key.p8" >> $GITHUB_ENV

            - name: "check versions"
              run: |
                echo "Snowflake CLI version: $(snow --version)"
                echo "Snowflake connections:"
                snow connection list

            - name: Create Snowflake connection
              run: |
                snow connection add \
                --connection-name default \
                --account "$SNOWFLAKE_ACCOUNT" \
                --username "$SNOWFLAKE_USER" \
                --rolename "$SNOWFLAKE_ROLE" \
                --warehouse "$SNOWFLAKE_WAREHOUSE" \
                --authenticator SNOWFLAKE_JWT \
                --private-key-path "$SNOWFLAKE_PRIVATE_KEY_PATH" \
                --default \
                --replace


            - name: List Snowflake connections
              run: snow connection list


            - name: Deploy Staging SQL
              run: |
                    snow sql -f sql/staging/01_databases.sql
                    snow sql -f sql/staging/02_schemas.sql
                    snow sql -f sql/staging/02_task_warehouse.sql
                    snow sql -f sql/staging/03_warehouses.sql
                    snow sql -f sql/staging/04_roles.sql
                    snow sql -f sql/staging/05_grants.sql