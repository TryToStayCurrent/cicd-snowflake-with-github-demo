name: Snowflake Deploy

on:
  push:
    branches:
      - dev
      - staging
      - main
    tags:
      - '*'
  workflow_dispatch:  # For manual triggers like GitLab's "when: manual"

env:
  SNOWFLAKE_AUTHENTICATOR: SNOWFLAKE_JWT

jobs:
  validate_staging_sql:
    name: Validate Staging SQL
    runs-on: ubuntu-latest
    container: snowflakedb/snowflake-cli:latest
    if: github.event_name == 'workflow_dispatch'  # Manual trigger only
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Snowflake credentials
        run: |
          mkdir -p ~/.snowflake
          echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" | base64 -d > ~/.snowflake/key.p8
          chmod 600 ~/.snowflake/key.p8
        env:
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
      
      - name: Validate SQL scripts
        run: |
          snow sql -f sql/staging/01_databases.sql --dry-run
          snow sql -f sql/staging/02_schemas.sql --dry-run
          snow sql -f sql/staging/02_task_warehouse.sql --dry-run
          snow sql -f sql/staging/03_warehouses.sql --dry-run
          snow sql -f sql/staging/04_roles.sql --dry-run
          snow sql -f sql/staging/05_grants.sql --dry-run

  validate_dev_sql:
    name: Validate Dev SQL
    runs-on: ubuntu-latest
    container: snowflakedb/snowflake-cli:latest
    if: github.ref == 'refs/heads/dev'
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Snowflake credentials
        run: |
          mkdir -p ~/.snowflake
          echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" | base64 -d > ~/.snowflake/key.p8
          chmod 600 ~/.snowflake/key.p8
        env:
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
      
      - name: Validate SQL scripts
        run: |
          snow sql -f sql/dev/databases.sql --dry-run
          snow sql -f sql/dev/schemas.sql --dry-run

  deploy_dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    container: snowflakedb/snowflake-cli:latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Snowflake credentials
        run: |
          mkdir -p ~/.snowflake
          echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" | base64 -d > ~/.snowflake/key.p8
          chmod 600 ~/.snowflake/key.p8
        env:
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
      
      - name: Deploy SQL scripts
        run: |
          snow sql -f sql/staging/01_databases.sql
          snow sql -f sql/staging/02_schemas.sql
          snow sql -f sql/staging/03_warehouses.sql
          snow sql -f sql/staging/04_roles.sql
          snow sql -f sql/staging/05_grants.sql

  deploy_staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    container: snowflakedb/snowflake-cli:latest
    if: github.ref == 'refs/heads/staging'
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Snowflake credentials
        run: |
          mkdir -p ~/.snowflake
          echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" | base64 -d > ~/.snowflake/key.p8
          chmod 600 ~/.snowflake/key.p8
        env:
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
      
      - name: Deploy SQL scripts
        run: |
          snow sql -f sql/staging/01_databases.sql
          snow sql -f sql/staging/02_schemas.sql
          snow sql -f sql/staging/03_warehouses.sql
          snow sql -f sql/staging/04_roles.sql
          snow sql -f sql/staging/05_grants.sql

  deploy_prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    container: snowflakedb/snowflake-cli:latest
    if: startsWith(github.ref, 'refs/tags/')  # Triggers on git tags
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Snowflake credentials
        run: |
          mkdir -p ~/.snowflake
          echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" | base64 -d > ~/.snowflake/key.p8
          chmod 600 ~/.snowflake/key.p8
        env:
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
      
      - name: Deploy SQL scripts
        run: |
          snow sql -f sql/staging/01_databases.sql
          snow sql -f sql/staging/02_schemas.sql
          snow sql -f sql/staging/03_warehouses.sql
          snow sql -f sql/staging/04_roles.sql
          snow sql -f sql/staging/05_grants.sql