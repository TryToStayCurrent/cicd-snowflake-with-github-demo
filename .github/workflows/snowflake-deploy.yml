name: Snowflake SQL Deploy

on:
  push:
    branches:
      - dev
      - staging
      - main
    tags:
      - '*'
  workflow_dispatch: {}

env:
  SNOWFLAKE_AUTHENTICATOR: SNOWFLAKE_JWT

jobs:
  validate_staging_sql:
    name: Validate Staging SQL (Manual)
    runs-on: ubuntu-latest
    container: snowflakedb/snowflake-cli:latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Snowflake Auth
        run: |
          mkdir -p ~/.snowflake
          echo "$SNOWFLAKE_PRIVATE_KEY" | base64 -d > ~/.snowflake/key.p8
          chmod 600 ~/.snowflake/key.p8

      - name: Validate Staging SQL
        run: |
          snow sql -f sql/staging/01_databases.sql
          snow sql -f sql/staging/02_schemas.sql
          snow sql -f sql/staging/02_task_warehouse.sql
          snow sql -f sql/staging/03_warehouses.sql
          snow sql -f sql/staging/04_roles.sql
          snow sql -f sql/staging/05_grants.sql

  deploy_dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    container: snowflakedb/snowflake-cli:latest
    if: github.ref == 'refs/heads/dev'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Snowflake Auth
        run: |
          mkdir -p ~/.snowflake
          echo "$SNOWFLAKE_PRIVATE_KEY" | base64 -d > ~/.snowflake/key.p8
          chmod 600 ~/.snowflake/key.p8

      - name: Deploy Dev SQL
        run: |
          snow sql -f sql/dev/01_databases.sql
          snow sql -f sql/dev/02_schemas.sql
          snow sql -f sql/dev/02_task_warehouse.sql
          snow sql -f sql/dev/03_warehouses.sql
          snow sql -f sql/dev/04_roles.sql
          snow sql -f sql/dev/05_grants.sql

  deploy_staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    container: snowflakedb/snowflake-cli:latest
    if: github.ref == 'refs/heads/staging'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Snowflake Auth
        run: |
          mkdir -p ~/.snowflake
          echo "$SNOWFLAKE_PRIVATE_KEY" | base64 -d > ~/.snowflake/key.p8
          chmod 600 ~/.snowflake/key.p8

      - name: Deploy Staging SQL
        run: |
          snow sql -f sql/staging/01_databases.sql
          snow sql -f sql/staging/02_schemas.sql
          snow sql -f sql/staging/02_task_warehouse.sql
          snow sql -f sql/staging/03_warehouses.sql
          snow sql -f sql/staging/04_roles.sql
          snow sql -f sql/staging/05_grants.sql

  deploy_prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    container: snowflakedb/snowflake-cli:latest
    if: startsWith(github.ref, 'refs/tags/')
    environment:
      name: production

    steps:
      - uses: actions/checkout@v4

      - name: Setup Snowflake Auth
        run: |
          mkdir -p ~/.snowflake
          echo "$SNOWFLAKE_PRIVATE_KEY" | base64 -d > ~/.snowflake/key.p8
          chmod 600 ~/.snowflake/key.p8

      - name: Deploy Production SQL
        run: |
          snow sql -f sql/prod/01_databases.sql
          snow sql -f sql/prod/02_schemas.sql
          snow sql -f sql/prod/02_task_warehouse.sql
          snow sql -f sql/prod/03_warehouses.sql
          snow sql -f sql/prod/04_roles.sql
          snow sql -f sql/prod/05_grants.sql
